name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: deep-goal workspace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify
        working-directory: deep-goal workspace
        run: npm run verify
